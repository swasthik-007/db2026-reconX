<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      const stored = localStorage.getItem('reconx-theme') || 'light';
      document.documentElement.setAttribute('data-theme', stored);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-shell">
  <header class="app-header" role="banner">
    <div class="app-header__inner">
      <h1 class="app-title">ReconX</h1>
      <nav class="app-nav" aria-label="Main navigation">
        <a href="dashboard.html" aria-current="page">Dashboard</a>
        <a href="#">Trades</a>
        <a href="#">Recon</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌗</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" role="complementary">
      <h2>Quick filters</h2>
      <ul>
        <li><a href="#">All trades</a></li>
        <li><a href="#">Open breaks</a></li>
        <li><a href="#">Today</a></li>
      </ul>
    </aside>

    <main class="app-main" role="main">
      <section aria-labelledby="kpi">
        <h2 id="kpi">Today at a glance</h2>
        <section class="dashboard-grid">
          <article class="stat-card"><h3>Trades</h3><p class="stat-value">120</p></article>
          <article class="stat-card"><h3>Matched</h3><p class="stat-value">105</p></article>
          <article class="stat-card stat-card--alert"><h3>Open breaks</h3><p class="stat-value">15</p></article>
        </section>
      </section>

      <section aria-labelledby="feed">
        <h2 id="feed" class="feed-heading">
          Live trade feed
          <span id="sse-status" class="status-badge status-badge--connecting">Connecting…</span>
        </h2>
        <section id="trade-feed" class="trade-feed" role="status" aria-live="polite" aria-atomic="false">
          <p class="feed-placeholder">Awaiting live trade updates.</p>
        </section>
      </section>
    </main>
  </div>

  <footer class="app-footer" role="contentinfo">
    <small>ReconX TDI 2026 · static dashboard (Day 7)</small>
  </footer>
  <script src="js/theme.js"></script>
  <script src="js/sse.js"></script>
</body>
</html>
