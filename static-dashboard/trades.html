<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      const stored = localStorage.getItem('reconx-theme') || 'light';
      document.documentElement.setAttribute('data-theme', stored);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-shell">
  <header class="app-header" role="banner">
    <div class="app-header__inner">
      <h1 class="app-title">ReconX</h1>
      <nav class="app-nav" aria-label="Main navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="trades.html" aria-current="page">Trades</a>
        <a href="#">Recon</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌗</button>
    </div>
  </header>

  <div class="app-body">
    <main class="app-main" role="main">
      <section aria-labelledby="trades-title">
        <h2 id="trades-title">Trades</h2>
        <div class="table-scroll">
          <table class="data-table" id="trades-table">
            <thead>
              <tr>
                <th data-col="tradeRef" data-dir="asc">Trade Ref <span class="resize-handle" aria-hidden="true"></span></th>
                <th data-col="symbol" data-dir="asc">Instrument <span class="resize-handle" aria-hidden="true"></span></th>
                <th data-col="quantity" data-dir="asc" data-type="number">Quantity <span class="resize-handle" aria-hidden="true"></span></th>
                <th data-col="price" data-dir="asc" data-type="number">Price <span class="resize-handle" aria-hidden="true"></span></th>
                <th data-col="status" data-dir="asc">Status <span class="resize-handle" aria-hidden="true"></span></th>
              </tr>
            </thead>
            <tbody id="trades-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <footer class="app-footer" role="contentinfo">
    <small>ReconX TDI 2026 · static trades table (Day 7)</small>
  </footer>
  <script src="js/theme.js"></script>
  <script src="js/trades.js"></script>
</body>
</html>
